<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <h1>Gestor de Tareas</h1>
      <p>Organiza tus pendientes diarios</p>
    </header>

    <form id="form-tarea" class="formulario">
      <input
        type="text"
        id="input-tarea"
        placeholder="Escribe una nueva tarea..."
        autocomplete="off"
      />
      <button type="submit">Agregar</button>
    </form>
    <p id="mensaje-error" class="error oculto"></p>


    <nav class="filtros" aria-label="Filtrar tareas">
      <button type="button" class="btn-filtro activo" data-filtro="todas">Todas</button>
      <button type="button" class="btn-filtro" data-filtro="pendientes">Pendientes</button>
      <button type="button" class="btn-filtro" data-filtro="completadas">Completadas</button>
    </nav>


    <ul id="lista-tareas" class="lista"></ul>
  </main>


  <script type="module" src="/src/main.ts"></script>
</body>
</html>
